name: Build OBD Tester APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 7.6

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew || true

    - name: Build with Gradle
      run: gradle build assembleDebug

    - name: Sign APK with Platform Keys
      run: |
        # Ищем apksigner в Android SDK (берем последнюю версию build-tools)
        BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
        APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
        
        # Подписываем наш APK
        $APKSIGNER sign --key keys/platform.pk8 --cert keys/platform.x509.pem --out app/build/outputs/apk/debug/app-signed.apk app/build/outputs/apk/debug/app-debug.apk
        
        # Проверяем, что подпись на месте
        $APKSIGNER verify app/build/outputs/apk/debug/app-signed.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OBD-Tester-Signed-APK
        path: app/build/outputs/apk/debug/app-signed.apk