apply plugin: 'com.android.application'

android {
    compileSdk 28

    defaultConfig {
        applicationId "com.example.obdtester"
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
    
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}